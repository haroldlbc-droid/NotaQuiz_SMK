<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Nota &amp; Kuiz Pembelajaran</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body id="top">
  <header>
    <h1>Generator Nota &amp; Kuiz Pembelajaran</h1>
    <p>Ringkasan, fakta penting dan kuiz untuk pelbagai subjek dan tingkatan.</p>
  </header>

  <main>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="controls">
          <label for="tingkatan-select">Pilih Tingkatan:</label>
          <select id="tingkatan-select"></select>

          <label for="subject-select">Pilih Subjek:</label>
          <select id="subject-select"></select>

          <label for="chapter-select">Pilih Bab:</label>
          <select id="chapter-select"></select>

          <label for="topic-select">Pilih Topik:</label>
          <select id="topic-select"></select>

          <label for="language-select">Pilih Bahasa:</label>
          <select id="language-select">
            <option value="ms-en">Malay / English</option>
            <option value="ms-zh">Malay / 中文</option>
          </select>

          <label for="mode-select">Pilih Mod:</label>
          <select id="mode-select">
            <option value="summary-facts">Fakta Penting</option>
            <option value="quiz">Soalan Kuiz</option>
          </select>

          <button id="generate-btn">Hasilkan</button>
        </div>
      </aside>

      <section id="output" class="output">
        <div id="status-message" class="status-message" style="display: none;"></div>
        <div id="result"></div>
      </section>
    </div>
  </main>

  <nav id="quick-nav" class="quick-nav" aria-label="Navigasi pantas">
    <span class="quick-nav-group" aria-label="Navigasi bab">
      <a href="#result" data-quick-action="previous-chapter" aria-label="Bab sebelumnya">&lt;-</a><span>Bab</span><a href="#result" data-quick-action="next-chapter" aria-label="Bab seterusnya">-&gt;</a>
    </span>
    <span class="quick-nav-group" aria-label="Navigasi topik">
      <a href="#result" data-quick-action="previous-section" aria-label="Topik sebelumnya">&lt;-</a><span>Topik</span><a href="#result" data-quick-action="next-section" aria-label="Topik seterusnya">-&gt;</a>
    </span>
    <a href="#result" data-quick-action="facts">Fakta</a>
    <a href="#result" data-quick-action="quiz">Kuiz</a>
    <a href="#top" data-quick-action="top">Atas</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
